[package]
name = "lx-tui"
version = "0.1.0"
edition = "2024"
description = "LX 终端工作区 TUI"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-stream = "0.1.19"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# 流式聊天 HTTPS 请求：rustls TLS，禁默认 native-tls，启用流式响应与 gzip。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "gzip", "json"] }

# macOS 读取进程 cwd 需要 proc_pidinfo（Linux 走 /proc，无额外依赖）。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
