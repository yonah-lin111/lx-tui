[package]
name = "lx-tui"
version = "0.1.0"
edition = "2024"
description = "LX 终端工作区 TUI"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
tokio-stream = "0.1.19"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4.33"
# `search` 工具的正则匹配：已在依赖树中（globset/ignore 与 termwiz 间接引入），
# 显式声明后可直接使用其 Unicode 感知与大小写不敏感匹配，不新增任何外部 crate。
regex = "1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }


# 流式聊天 HTTPS 请求：rustls TLS，禁默认 native-tls，启用流式响应与 gzip。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "gzip", "json"] }
similar = "2.7"

# Unix 平台能力：macOS 读取进程 cwd 需要 proc_pidinfo，环境快照需要 localtime_r
# 取本地时间与时区（Windows 无 libc 依赖，走 UTC 兜底）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 图像编解码库在 dev 模式下开启最高优化，避免开发态大图缩放/编码阻塞 UI 主线程。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
