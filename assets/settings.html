<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lx-tui settings</title>
<link rel="stylesheet" href="/settings.css">
</head>
<body>
<nav class="side">
  <h1>lx-tui</h1>
  <button id="tab-general" class="active" onclick="showTab('general')">General</button>
  <button id="tab-commands" onclick="showTab('commands')">Commands</button>
  <button id="tab-models" onclick="showTab('models')">Models</button>
</nav>
<div class="side-resizer" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
<main>
  <section id="view-general" class="view">
    <div class="view-head">
      <h2>General</h2>
      <div id="actions-general" class="view-actions"></div>
    </div>
    <p class="status" id="general-status">Loading…</p>
    <fieldset>
      <legend>Layout</legend>
      <div class="grid">
        <div><label for="sidebar_width">Sidebar width</label><input id="sidebar_width" type="number" min="1" max="200"></div>
        <div><label for="sidebar_min_width">Sidebar min width</label><input id="sidebar_min_width" type="number" min="1" max="200"></div>
        <div><label for="sidebar_max_width">Sidebar max width</label><input id="sidebar_max_width" type="number" min="1" max="200"></div>
        <div><label for="narrow_width">Narrow width</label><input id="narrow_width" type="number" min="1" max="500"></div>
        <div><label for="min_width">Min screen width</label><input id="min_width" type="number" min="1" max="500"></div>
        <div><label for="min_height">Min screen height</label><input id="min_height" type="number" min="1" max="500"></div>
        <div><label for="min_pane_width">Min pane width</label><input id="min_pane_width" type="number" min="1" max="500"></div>
        <div><label for="min_pane_height">Min pane height</label><input id="min_pane_height" type="number" min="1" max="500"></div>
      </div>
    </fieldset>
    <div class="actions">
      <button class="ghost" onclick="loadState()">Reload</button>
    </div>
  </section>

  <section id="view-commands" class="view hidden">
    <div class="view-head">
      <h2>Commands</h2>
      <div id="actions-commands" class="view-actions"></div>
    </div>
    <div class="commands-toolbar">
      <label>Type</label>
      <div id="cmd-filter-select" class="select-host toolbar-select"></div>
      <button class="ghost" onclick="loadState()">Reload</button>
      <span class="status" id="commands-status">Loading…</span>
    </div>
    <div class="commands-grid">
      <nav class="commands-nav" aria-label="Custom commands">
        <div id="command-list" class="command-list"></div>
        <button id="new-command-row" type="button" class="nav-item new" onclick="newCommand()">
          <span class="nav-slash">+</span>
          <span class="nav-name">New command</span>
        </button>
      </nav>
      <div class="cmd-resizer" id="cmd-resizer" role="separator" aria-orientation="vertical" aria-label="Resize command list"></div>

      <section class="editor-card">
        <div id="editor-empty" class="editor-empty">
          <p id="editor-empty-text">Select a command to edit.</p>
          <button class="primary" onclick="newCommand()">New command</button>
        </div>

        <div id="editor" class="hidden">
          <div class="editor-head">
            <h3 id="editor-legend">Edit command</h3>
            <div class="actions">
              <button class="ghost" onclick="hideEditor()">Cancel</button>
              <button class="danger" onclick="deleteCommand()">Delete</button>
            </div>
          </div>
          <div class="editor-body">
            <fieldset>
              <div class="field-grid">
                <div>
                  <label for="cmd-name">Name</label>
                  <input id="cmd-name" type="text" placeholder="my-command">
                </div>
                <div>
                  <label>Scope</label>
                  <div id="cmd-scope-select" class="select-host"></div>
                </div>
                <div>
                  <label>Type</label>
                  <div id="cmd-kind-select" class="select-host"></div>
                </div>
                <div>
                  <label>Visibility</label>
                  <div id="cmd-md-scope-select" class="select-host"></div>
                </div>
                <div>
                  <label>Block type (agent block only)</label>
                  <div id="cmd-block-type-select" class="select-host"></div>
                </div>
                <div>
                  <label for="cmd-title">Block title (agent block only)</label>
                  <input id="cmd-title" type="text" placeholder="title">
                </div>
                <div>
                  <label for="cmd-description">Description</label>
                  <input id="cmd-description" type="text">
                </div>
              </div>
            </fieldset>
            <fieldset class="editor-markdown">
              <legend>Markdown body</legend>
              <textarea id="cmd-body"></textarea>
            </fieldset>
          </div>
        </div>
      </section>
    </div>
  </section>

  <section id="view-models" class="view hidden">
    <div class="view-head">
      <h2>Models</h2>
      <div id="actions-models" class="view-actions"></div>
    </div>
    <div class="models-toolbar">
      <button class="ghost" onclick="loadModels()">Reload</button>
      <label>Default model</label>
      <div id="default-model-host" class="select-host models-toolbar-select"></div>
      <span class="status" id="models-status">Loading…</span>
      <span class="status" id="models-revision"></span>
    </div>
    <div class="models-grid">
      <nav class="models-nav" aria-label="Model providers">
        <div id="provider-list" class="provider-list"></div>
        <button id="new-provider-row" type="button" class="nav-item new" onclick="newProvider()">
          <span class="nav-slash">+</span>
          <span class="nav-name">New provider</span>
        </button>
      </nav>
      <div class="models-resizer" id="models-resizer" role="separator" aria-orientation="vertical" aria-label="Resize provider list"></div>
      <section class="editor-card">
        <div id="provider-empty" class="editor-empty">
          <p id="provider-empty-text">Select a provider to edit.</p>
          <button class="primary" onclick="newProvider()">New provider</button>
        </div>
        <div id="provider-editor" class="hidden">
          <div class="editor-head">
            <h3 id="provider-legend">Edit provider</h3>
            <div class="actions">
              <button class="ghost" onclick="duplicateProvider()">Duplicate</button>
              <button class="danger" onclick="deleteProvider()">Delete</button>
            </div>
          </div>
          <div class="editor-body" id="provider-editor-body">
            <div class="card">
              <div class="card-head"><h3 class="card-title">Provider</h3></div>
              <div class="field-grid">
                <div>
                  <label for="prov-id">ID (stable key)</label>
                  <input id="prov-id" type="text" readonly>
                </div>
                <div>
                  <label for="prov-name">Display name</label>
                  <input id="prov-name" type="text">
                </div>
                <div class="field-wide">
                  <label>Transport type</label>
                  <div id="prov-type-host" class="select-host"></div>
                </div>
                <div class="field-wide">
                  <label class="field-hint"><input id="prov-enabled" type="checkbox"> Enabled</label>
                </div>
                <div class="field-wide">
                  <label for="prov-base-url">Base URL</label>
                  <input id="prov-base-url" type="text" placeholder="api.host/v1 (scheme required on save)">
                </div>
                <div class="field-wide">
                  <label for="prov-api-key">API key</label>
                  <input id="prov-api-key" type="password" autocomplete="off" placeholder="leave blank to keep">
                  <label class="field-hint"><input id="prov-clear-key" type="checkbox"> Clear stored key</label>
                  <span class="status" id="prov-key-state"></span>
                </div>
              </div>
            </div>
            <div class="card">
              <div class="card-head">
                <h3 class="card-title">Models</h3>
                <div class="card-tools">
                  <button class="ghost" onclick="addModel()">Add model</button>
                  <button class="ghost" onclick="fetchModels()">Fetch models</button>
                </div>
              </div>
              <div id="fetch-candidates" class="fetch-candidates hidden"></div>
              <div id="model-list" class="model-list"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </section>
</main>
<script src="/settings.js"></script>
<script src="/settings_models.js"></script>
</body>
</html>
